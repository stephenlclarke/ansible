---
profile: production
warn_list:
  - galaxy[version-incorrect]  # until collection gets bumped to 1.x.x
skip_list:
  - var-naming[no-role-prefix]  # https://github.com/ansible/ansible-lint/pull/3422#issuecomment-1549584988
  - yaml[document-start]  # existing collection files omit document markers
  - yaml[indentation]  # retain the collection's established YAML layout
